name: CI

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        id: run_tests
        run: pytest

      - name: Notify n8n on failure
        if: failure()
        run: |
          curl -X POST " https://railroad-involves-settlement-areas.trycloudflare.com/webhook/cicd-pipeline-event" \
            -H "Content-Type: application/json" \
            -d '{
              "status": "failure",
              "branch": "${{ github.ref_name }}",
              "commit": "${{ github.sha }}",
              "author": "${{ github.actor }}",
              "job_name": "test",
              "repo_owner": "${{ github.repository_owner }}",
              "repo_name": "${{ github.event.repository.name }}",
              "failure_log": "Test step failed on branch ${{ github.ref_name }}. See run for full details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }'

      - name: Notify n8n on success
        if: success()
        run: |
          curl -X POST "REPLACE_WITH_YOUR_N8N_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d '{
              "status": "success",
              "branch": "${{ github.ref_name }}",
              "commit": "${{ github.sha }}",
              "author": "${{ github.actor }}",
              "job_name": "test",
              "repo_owner": "${{ github.repository_owner }}",
              "repo_name": "${{ github.event.repository.name }}",
              "failure_log": ""
            }'